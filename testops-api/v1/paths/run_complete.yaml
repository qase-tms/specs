post:
  operationId: complete-run
  tags: [ runs ]
  summary: Complete a specific run
  description: |
    This method allows to complete a specific run.

    `result.completion` is `pending_complete` while bulk results for the run
    are still in the queue: the run completes after the last of them.
    Otherwise it is the status of the finished run (`passed`, `failed`,
    `aborted`), the same value as `status_text` of the run.
  parameters:
    - $ref: '../parameters/Code.yaml'
    - $ref: '../parameters/Id.yaml'
  responses:
    200:
      description: A result.
      content:
        application/json:
          schema:
            $ref: '../schemas/responses/RunCompleteResponse.yaml'
    400:
      description: Bad Request.
    401:
      description: Unauthorized.
    403:
      description: Forbidden.
    404:
      description: Not Found.
    422:
      description: Unprocessable Entity.
    429:
      description: Too Many Requests.
