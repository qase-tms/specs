type: object
description: >-
  A step of the proposed test case. When `steps_type` is `gherkin` the step carries
  the scenario in `value` and nothing else: a non-empty `action`, `expected_result`,
  `data`, `attachments`, `shared` or nested `steps` is rejected.
properties:
  action:
    type: string
    description: Step action text. Classic steps only.
  shared:
    type: string
    description: >-
      Hash of an existing shared step to insert at this position.
  expected_result:
    type: string
  data:
    type: string
  value:
    type: string
    description: >-
      Gherkin scenario text. Used when steps_type is "gherkin".
      Example: "Given a user exists\nWhen they log in\nThen they see the dashboard"
  attachments:
    $ref: 'Attachment.hash_list.yaml'
  steps:
    type: array
    description: 'Nested steps may be passed here. Use same structure for them.'
    items:
      type: object
