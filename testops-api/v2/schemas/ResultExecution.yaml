type: object
properties:
  start_time:
    type: number
    description: Unix epoch time in seconds (whole part) and milliseconds (fractional part).
    format: double
    nullable: true
  end_time:
    type: number
    description: Unix epoch time in seconds (whole part) and milliseconds (fractional part).
    format: double
    nullable: true
  status:
    type: string
    description: Can have the following values passed, failed, blocked, skipped, invalid + custom statuses
  duration:
    type: integer
    description: Duration of the test execution in milliseconds.
    format: int64
    nullable: true
  stacktrace:
    type: string
    nullable: true
  error_context:
    type: string
    nullable: true
    description: >-
      Free-form failure context captured by the reporter. For Playwright this is the content of
      error-context.md (test info, error details, page snapshot). Stored verbatim so it can be
      copied as raw text. Truncated at 262144 characters.
  thread:
    type: string
    nullable: true
required:
  - status
